name: CI/CD - Build and Push FoodSphere POS to GHCR.io and Deploy to K8S
on:
  push:
    branches: [ "dev" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GHCR_USERNAME }}
        password: ${{ secrets.GHCR_PAT }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/foodsphere/foodsphere-frontend/pos-app:latest
          ghcr.io/foodsphere/foodsphere-frontend/pos-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v6

    - name: Set up Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Update Kubernetes resources
      env:
        KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
      run: |
        # Create kubeconfig directory
        mkdir -p $HOME/.kube
        # Write KUBECONFIG secret to file (assuming it's raw YAML)
        echo "${KUBE_CONFIG_DATA}" > $HOME/.kube/config
        # Set KUBECONFIG to the file path
        export KUBECONFIG=$HOME/.kube/config
        
        # Update image tag using kustomize
        cd k8s
        kustomize edit set image ghcr.io/foodsphere/foodsphere-frontend/pos-app=ghcr.io/foodsphere/foodsphere-frontend/pos-app:${{ github.sha }}
        
        # Apply manifests
        kubectl apply -k .